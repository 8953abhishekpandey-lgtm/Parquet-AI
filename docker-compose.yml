services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: local-parquet-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: parquet-ai-backend
    env_file:
      - .env
    environment:
      QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIR: /app/uploads
      DATASET_STORE_DIR: /app/backend/storage/datasets
      QDRANT_LOCAL_PATH: /app/backend/storage/qdrant
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./backend/storage:/app/backend/storage
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: parquet-ai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
