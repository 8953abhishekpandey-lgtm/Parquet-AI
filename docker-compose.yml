services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: local-parquet-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: parquet-ai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./backend/storage:/app/backend/storage
    env_file:
      - .env
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: parquet-ai-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
